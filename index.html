<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Python Projects</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #121a2b;
        --panel-2: #1d2940;
        --text: #e5ecff;
        --muted: #adc0ea;
        --accent: #6ee7b7;
        --accent-2: #60a5fa;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, var(--bg), var(--panel));
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .card {
        width: min(900px, 90vw);
        background: rgba(18, 26, 43, 0.9);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.28);
        padding: 40px 28px;
      }
      h1 {
        margin-top: 0;
        font-size: clamp(2rem, 5vw, 3.5rem);
        letter-spacing: 0.04em;
      }
      p {
        color: var(--muted);
        line-height: 1.7;
        font-size: 1.05rem;
      }
      .tag {
        display: inline-block;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(110, 231, 183, 0.14);
        border: 1px solid rgba(110, 231, 183, 0.3);
        color: var(--accent);
        font-weight: 700;
        margin-bottom: 16px;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 26px;
      }
      a.button {
        text-decoration: none;
        color: white;
        background: linear-gradient(135deg, var(--accent-2), var(--accent));
        padding: 12px 18px;
        border-radius: 12px;
        font-weight: 700;
        transition: transform 0.2s ease;
      }
      a.button:hover {
        transform: translateY(-2px);
      }
      .secondary {
        background: var(--panel-2);
        border: 1px solid rgba(255,255,255,0.08);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="tag">GitHub Pages</div>
      <h1>Python Projects Repository</h1>
      <p>
        This repository contains Python assignments and project work, including the Experiential Learning project folder.
        GitHub Pages is now configured to publish this repository as a simple live website landing page.
      </p>
      <div class="links">
        <a class="button" href="https://github.com/tejalselokar25/Python" target="_blank" rel="noreferrer">Open Repository</a>
        <a class="button secondary" href="Experiential%20Learning/README.md">Project README</a>
      </div>
    </main>
  </body>
</html>
